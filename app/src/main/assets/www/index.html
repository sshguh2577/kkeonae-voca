<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>꺼내보카</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="메뉴">
    <button class="tab" data-act="tab" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12.5" rx="1.5"/><path d="M3.5 9.5h17"/><path d="M6 4h12"/></svg>
      <span>오늘</span>
    </button>
    <button class="tab" data-act="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/><path d="M10 12.2l1.4 1.4 2.8-3"/></svg>
      <span>출석</span>
    </button>
    <button class="tab" data-act="tab" data-tab="words">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h6l1.5 2H20v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3.8l1.5 2"/></svg>
      <span>단어</span>
    </button>
    <button class="tab" data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>설정</span>
    </button>
  </nav>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="stamp-layer" class="stamp-layer" aria-hidden="true"></div>
<input type="file" id="web-file" accept=".json,application/json,text/plain" hidden>
<script src="fsrs.js"></script>
<script src="app.js"></script>
</body>
</html>
